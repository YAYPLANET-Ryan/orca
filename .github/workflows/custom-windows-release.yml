name: Custom Windows Release

on:
  push:
    branches:
      - ryan/ceo-office-sidebar
      - ryan/ceo-office-sidebar-latest
      - 'ryan/ceo-office-sidebar-release-*'
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.175-ceo.20260806.1)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: custom-windows-release
  cancel-in-progress: false

env:
  ORCA_UPDATE_OWNER: YAYPLANET-Ryan
  ORCA_UPDATE_REPO: orca-ceo-office

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify CEO customization and session preservation
        shell: pwsh
        run: |
          pnpm exec vitest run --config config/vitest.config.ts `
            src/renderer/src/components/ceo-office `
            src/renderer/src/components/sidebar/WorktreeCardAgents.activation.test.tsx `
            src/main/updater-repository.test.ts `
            src/main/updater-auto-download.test.ts `
            src/main/updater-release-builds.test.ts `
            src/main/updater.quit-and-install.test.ts `
            src/main/persistence-workspace-session-scrollback.test.ts `
            src/main/persistence-host-partitioned-sessions.test.ts `
            src/main/ai-vault/session-parse-cache-persistence.test.ts `
            src/renderer/src/lib/workspace-session-persistence-gate.test.ts `
            src/renderer/src/lib/workspace-session-host-persistence.test.ts `
            src/renderer/src/lib/resume-sleeping-agent-session.test.ts

      - name: Resolve release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            # Why not package.json: on this branch it tracks upstream's rolling -rc
            # value, which lags the released numbers. It reads 1.4.174-rc.0 while
            # 1.4.176-ceo.* is already published, so deriving from it yields a
            # version BELOW the installed build. The updater takes the most recently
            # published -ceo release and compares by string equality, so that ships
            # a downgrade. Derive from upstream's latest release instead — the same
            # source sync-upstream uses — and let the date suffix keep successive
            # builds on one base monotonic.
            $base = (gh api repos/stablyai/orca/releases/latest --jq .tag_name)
            # `gh api` prints the string "null" when the response has no tag_name —
            # a rate limit or a 404 body both land there — and a blank check lets
            # that through, publishing "null-ceo.<date>.<run>". The updater compares
            # versions as strings, so a release named that is worse than no release.
            # Require the shape we expect instead of merely non-empty.
            if ($LASTEXITCODE -ne 0 -or $base -notmatch '^v?\d+\.\d+\.\d+') {
              throw "Could not resolve the latest upstream release tag (got '$base')."
            }
            $base = ($base -replace '^v', '').Split('-')[0]
            $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $version = "$base-ceo.$date.$env:RUN_NUMBER"
          }
          "ORCA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved release version: $version"

      - name: Build desktop
        shell: pwsh
        run: pnpm run build:desktop

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Verify assets
        shell: pwsh
        run: |
          $assets = @(
            "dist/orca-windows-setup.exe",
            "dist/orca-windows-setup.exe.blockmap",
            "dist/latest.yml"
          )
          $missing = @()
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              $missing += $asset
            } else {
              Write-Host "Found: $asset ($((Get-Item $asset).Length) bytes)"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "##[error]Missing assets: $($missing -join ', ')"
            Write-Host "##[error]Contents of dist/:"
            Get-ChildItem dist -Recurse | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
            exit 1
          }

      - name: Retain verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-release-${{ env.ORCA_RELEASE_VERSION }}
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:ORCA_RELEASE_VERSION"
          $assets = @(
            "dist/orca-windows-setup.exe",
            "dist/orca-windows-setup.exe.blockmap",
            "dist/latest.yml"
          )
          gh release create $tag @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title $env:ORCA_RELEASE_VERSION `
            --notes "Custom Orca Windows build with CEO Office sidebar."
          Write-Host "##[notice]Published: $tag"
