name: Custom Windows Release

on:
  push:
    branches: [ryan/ceo-office-sidebar]
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.175-ceo.20260806.1)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: custom-windows-release
  cancel-in-progress: false

env:
  ORCA_RELEASE_REPOSITORY: YAYPLANET-Ryan/orca
  ORCA_UPDATE_OWNER: YAYPLANET-Ryan
  ORCA_UPDATE_REPO: orca

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: ryan/ceo-office-sidebar
          fetch-depth: 1

      - name: Verify canonical release repository
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne $env:ORCA_RELEASE_REPOSITORY) {
            throw "Refusing to publish from '$env:GITHUB_REPOSITORY'; canonical release repository is '$env:ORCA_RELEASE_REPOSITORY'."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify CEO customization and session preservation
        shell: pwsh
        run: |
          pnpm exec vitest run --config config/vitest.config.ts `
            src/renderer/src/components/ceo-office `
            src/renderer/src/components/sidebar/WorktreeCardAgents.activation.test.tsx `
            src/renderer/src/components/sidebar/worktree-title-derived-agent-rows.test.ts `
            src/renderer/src/components/terminal-pane/pty-connection-cold-restore-agent-resume.test.ts `
            src/renderer/src/components/terminal-pane/pty-connection/reattach-payload-context.test.ts `
            src/renderer/src/components/terminal-pane/pty-connection/reattach-payload-ssh-reconnect-model-paint.test.ts `
            src/renderer/src/components/terminal-pane/pty-transport-connect-spawn.test.ts `
            src/renderer/src/components/terminal-pane/remote-runtime-pty-transport-create-handoff.test.ts `
            src/renderer/src/components/terminal-pane/session-restored-banner-pane-state.test.tsx `
            src/main/updater-repository.test.ts `
            src/main/updater-auto-download.test.ts `
            src/main/updater-release-builds.test.ts `
            src/main/updater.quit-and-install.test.ts `
            src/main/persistence-workspace-session-scrollback.test.ts `
            src/main/persistence-host-partitioned-sessions.test.ts `
            src/main/ai-vault/session-parse-cache-persistence.test.ts `
            src/renderer/src/lib/workspace-session-persistence-gate.test.ts `
            src/renderer/src/lib/workspace-session-host-persistence.test.ts `
            src/renderer/src/lib/resume-sleeping-agent-session.test.ts

      - name: Resolve release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            # Derive from the checked-out source so a v1.4.191 build cannot be
            # mislabeled with an older upstream release number.
            $sourceVersion = (node -p "require('./package.json').version").Trim()
            if ($LASTEXITCODE -ne 0 -or $sourceVersion -notmatch '^(\d+\.\d+\.\d+)(?:-|$)') {
              throw "Could not resolve the source version from package.json (got '$sourceVersion')."
            }
            $base = $Matches[1]

            $publishedBases = gh api --paginate `
              "repos/$env:ORCA_RELEASE_REPOSITORY/releases?per_page=100" `
              --jq '.[].tag_name' |
              ForEach-Object {
                if ($_ -match '^v?(\d+\.\d+\.\d+)-ceo\.') {
                  [version]$Matches[1]
                }
              }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect existing canonical releases."
            }
            $newerPublishedBase = $publishedBases |
              Where-Object { $_ -gt [version]$base } |
              Sort-Object -Descending |
              Select-Object -First 1
            if ($newerPublishedBase) {
              throw "Source base $base is older than published custom base $newerPublishedBase."
            }

            $kst = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
              (Get-Date).ToUniversalTime(),
              'Korea Standard Time'
            )
            $date = $kst.ToString('yyyyMMdd')
            $version = "$base-ceo.$date.$env:RUN_NUMBER"
          }
          "ORCA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved release version: $version"

      - name: Build desktop
        shell: pwsh
        run: pnpm run build:desktop

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Verify assets
        shell: pwsh
        run: |
          $assets = @(
            "dist/orca-windows-setup.exe",
            "dist/orca-windows-setup.exe.blockmap",
            "dist/latest.yml"
          )
          $missing = @()
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              $missing += $asset
            } else {
              Write-Host "Found: $asset ($((Get-Item $asset).Length) bytes)"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "##[error]Missing assets: $($missing -join ', ')"
            Write-Host "##[error]Contents of dist/:"
            Get-ChildItem dist -Recurse | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
            exit 1
          }

          $updateConfigPath = "dist/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path -LiteralPath $updateConfigPath)) {
            throw "Missing packaged update configuration: $updateConfigPath"
          }
          $updateConfig = Get-Content -LiteralPath $updateConfigPath -Raw
          if ($updateConfig -notmatch '(?m)^owner:\s*YAYPLANET-Ryan\s*$' -or
              $updateConfig -notmatch '(?m)^repo:\s*orca\s*$' -or
              $updateConfig -notmatch '(?m)^provider:\s*github\s*$') {
            throw "Packaged app-update.yml does not point to YAYPLANET-Ryan/orca on GitHub."
          }
          Write-Host "Verified packaged update feed: YAYPLANET-Ryan/orca"

      - name: Retain verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-release-${{ env.ORCA_RELEASE_VERSION }}
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:ORCA_RELEASE_VERSION"
          $assets = @(
            "dist/orca-windows-setup.exe",
            "dist/orca-windows-setup.exe.blockmap",
            "dist/latest.yml"
          )
          gh release create $tag @assets `
            --repo "$env:ORCA_RELEASE_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title $env:ORCA_RELEASE_VERSION `
            --notes "Custom Orca Windows build with CEO Office sidebar and cold-restore session preservation."
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish $tag to $env:ORCA_RELEASE_REPOSITORY."
          }
          Write-Host "##[notice]Published: $tag"
