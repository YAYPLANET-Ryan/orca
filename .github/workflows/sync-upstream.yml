name: Sync Upstream

on:
  schedule:
    # Saturday 01:00 KST (Friday 16:00 UTC). Three hours ahead of the 04:00 KST
    # window when the desktop and laptop scheduled tasks look for a new build,
    # so the release is published before the machines go looking for it.
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: ryan/ceo-office-sidebar
          fetch-depth: 0

      # Track upstream *releases*, not every commit on upstream/main. Releases are
      # what the custom build is supposed to follow, and the tag also gives us a
      # correct base version (see "Trigger custom release").
      - name: Resolve latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/stablyai/orca/releases/latest --jq .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Could not resolve the latest upstream release tag."
            exit 1
          fi
          # The tag reaches later steps as shell input, so pin its shape here rather
          # than trusting whatever upstream published. A tag is attacker-controlled
          # from this repository's point of view, and a name carrying $( ) would be
          # substituted into a run block as text and then executed by the shell.
          if ! printf '%s' "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing an upstream tag with an unexpected shape: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $tag"

      # Every step below takes the tag through the environment rather than through
      # ${{ }} interpolation: an expression is pasted into the script as text before
      # the shell sees it, so the shell would parse whatever the tag contains.
      - name: Fetch upstream release tag
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/stablyai/orca.git
          # Forced so re-running the workflow for a tag already fetched locally does
          # not stop at "would clobber existing tag".
          git fetch upstream --quiet --force \
            "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream-${UPSTREAM_TAG}"

      - name: Decide whether a sync is needed
        id: compare
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "upstream-${UPSTREAM_TAG}^{commit}")
          # Why not `git diff --quiet HEAD upstream/main`: this branch carries the
          # CEO commits on top of upstream, so its tree can never equal upstream's.
          # That check reported "changed" on every single run, which meant a full
          # Windows build and a published GitHub release every night whether or not
          # upstream had moved. Ancestry is the question we actually mean to ask.
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Branch already contains ${UPSTREAM_TAG} - nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Need to merge ${UPSTREAM_TAG}."
          fi

      - name: Merge upstream release
        id: merge
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit "upstream-${UPSTREAM_TAG}"; then
            echo "merge_ok=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "merge_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged branch
        if: steps.compare.outputs.changed == 'true' && steps.merge.outputs.merge_ok == 'true'
        run: git push origin HEAD:ryan/ceo-office-sidebar

      # Gated on merge_ok as well as changed. Previously only the push was gated,
      # so a conflicted sync still kicked off a release build of the unmerged branch.
      #
      # The version is derived from the upstream release tag rather than letting the
      # release workflow bump package.json. package.json on this branch tracks
      # upstream's rolling -rc value, which lags the real release numbers, so the
      # derived version could land *below* an existing -ceo release. The updater
      # picks the most recently published -ceo release and compares versions by
      # string equality, so that would install an older build over a newer one.
      - name: Trigger custom release
        if: steps.compare.outputs.changed == 'true' && steps.merge.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="${UPSTREAM_VERSION}-ceo.$(date -u +%Y%m%d).${RUN_NUMBER}"
          echo "Dispatching custom release $version"
          gh workflow run custom-windows-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref ryan/ceo-office-sidebar \
            -f version="$version"

      # A warning annotation is invisible unless someone opens the run. Weekly runs
      # make that worse: a conflict could sit unnoticed for a week or more.
      - name: Report conflict
        if: steps.compare.outputs.changed == 'true' && steps.merge.outputs.merge_ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="${UPSTREAM_TAG}"
          title="Upstream sync conflict: $tag"
          echo "::warning::Upstream merge conflict on ryan/ceo-office-sidebar for $tag. Manual resolution required."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
            "\`git merge $tag\` into \`ryan/ceo-office-sidebar\` conflicted, so no release was built.

          Resolve locally:

          \`\`\`
          git fetch upstream --tags
          git checkout ryan/ceo-office-sidebar
          git merge $tag
          # resolve, then
          git push origin ryan/ceo-office-sidebar
          \`\`\`

          Then dispatch \`custom-windows-release.yml\` with version \`${UPSTREAM_VERSION}-ceo.<YYYYMMDD>.<run>\`.

          Run: ${RUN_URL}"
